version: 2.1

executors:
  shared-executor:
    machine:
      image: ubuntu-2404:2024.11.1 # Machine image updates: https://circleci.com/developer/machine/image/ubuntu-2404
      resource_class: large
    environment:
      REDCAP_VERSION: "14.7.0"
      CCTC_DOCKER_BRANCH: "MX_MAC"
      CYPRESS_BRANCH: "redcap_val"
      RSVC_BRANCH: "redcap_val"
      RCTF_BRANCH: "main"

workflows:
  version: 2
  workflows:
    jobs:
      - run-tests:
          context: REDCap Tests
      - html-reports:
          context: REDCap Tests
          requires:
            - run-tests

commands:
  setup-redcap:
    parameters:
      dir:
        type: string
        default: "."
    steps:
      - add_ssh_keys
      - run:
          name: Build the REDCap Image
          command: |
            cd << parameters.dir >>
            git clone --branch ${CCTC_DOCKER_BRANCH} git@github.com:CCTC-team/CCTC_REDCap_Docker.git ../CCTC_REDCap_Docker
            cd ../CCTC_REDCap_Docker
            git log -1 # Include current commit in build logs
      - run:
          name: Get REDCap Source
          command: |
            cd << parameters.dir >>/..
            mkdir -p redcap_source
            cd redcap_source
            if [[ "$REDCAP_VERSION" = "99.99.99" ]]; then
              export BRANCH=master
            else
              export BRANCH=$REDCAP_VERSION
            fi
            git clone --depth=1 --branch=$BRANCH git@github.com:vanderbilt-redcap/REDCap.git redcap_v${REDCAP_VERSION}
            git -C redcap_v${REDCAP_VERSION} log -1 # Include current commit in build logs
            cp -a redcap_v${REDCAP_VERSION}/Resources/install_files/redcap/* .
            cp -a redcap_v${REDCAP_VERSION}/Resources/nonversioned_files/* .
            # Copy database.php if exists in CircleCI config
            if [ -f /home/circleci/project/.circleci/redcap_install_files/database.php ]; then
              cp /home/circleci/project/.circleci/redcap_install_files/database.php .
            fi
      - run:
          name: Create MySQL Volume
          command: |
            docker volume create mySQLVolume

jobs:
  run-tests:
    executor: shared-executor
    parallelism: 30
    steps:
      - checkout
      - run:
          name: Checkout redcap_val branch
          command: |
            cd /home/circleci/project
            git fetch origin ${CYPRESS_BRANCH}
            git checkout ${CYPRESS_BRANCH}
            git log -1 # Show current commit
      - setup-redcap
      - run:
          name: Start Docker REDCap Container
          command: |
            cd /home/circleci/CCTC_REDCap_Docker
            docker compose build
            docker compose up -d
      - run:
          name: Install composer dependencies
          command: |
            docker exec -it debian sh -c "cd /var/www/html/redcap_v${REDCAP_VERSION} && COMPOSER_DISABLE_XDEBUG_WARN=1 composer require --dev phpunit/php-code-coverage:^11"
      - run:
          name: Permissions on coverage files
          command: |
            docker exec -it debian sh -c "chmod 777 /tmp/path/coverage"
      - run:
          name: Change eDocs & Temp folder permissions
          command: |
            sudo chmod 777 /home/circleci/edocs
      - run:
          name: Configure Cypress environment
          command: |
            cd /home/circleci/project
            sed s/PID/$PROJECT_ID/g cypress.config.js.example > cypress.config.js
            mv cypress.env.json.example cypress.env.json
            sed -i '/  "redcap_version": ".*",/c\  "redcap_version": "'${REDCAP_VERSION}'",' cypress.env.json
      - run:
          name: Update package.json dependencies for CCTC-team repositories
          command: |
            cd /home/circleci/project
            # Update rctf to use CCTC-team main branch
            sed -i 's|"rctf": "github:vanderbilt-redcap/rctf#[^"]*"|"rctf": "github:CCTC-team/rctf#'${RCTF_BRANCH}'"|' package.json
            # Update redcap_rsvc to use CCTC-team/vanderbilt_redcap_rsvc redcap_val branch
            sed -i 's|"redcap_rsvc": "github:vanderbilt-redcap/redcap_rsvc#[^"]*"|"redcap_rsvc": "github:CCTC-team/vanderbilt_redcap_rsvc#'${RSVC_BRANCH}'"|' package.json
            # Update repository URL to CCTC-team
            sed -i 's|"url": "https://github.com/vanderbilt-redcap/redcap_cypress.git"|"url": "https://github.com/CCTC-team/redcap_cypress.git"|' package.json
            cat package.json | grep -E '(rctf|redcap_rsvc|repository)' -A 1
      - run:
          name: Install Cypress
          command: |
            export NVM_DIR="/opt/circleci/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use stable
            npm install
            npm run redcap_rsvc:install
      - run:
          name: Run Tests
          command: |
            export UID # Referenced in docker-compose.yml by 'if running via automation' RCTF steps
            CYPRESS_prettyEnabled=true npx cypress run --record --key $RECORD_KEY --parallel --group core-tests --browser chrome --reporter junit --reporter-options=mochaFile=coverage/test-results/[hash].xml || true
      - run:
          name: Coverage Report
          command: |
            docker exec -i debian php /var/www/html/phpcov.phar merge --clover /tmp/path/coverage-report/merged-coverage-${CIRCLE_NODE_INDEX}.xml /tmp/path/coverage
      - run:
          name: Debug Workspace Contents
          command: ls -l /home/circleci/project/coverage-report
      - run:
          name: Debug Cypress Videos
          command: ls -l /home/circleci/project/cypress/videos
      - persist_to_workspace:
          root: .
          paths:
            - coverage-report
            - coverage
            - cypress/videos
            - redcap_rsvc

  html-reports:
    executor: shared-executor
    steps:
      - checkout
      - run:
          name: Checkout redcap_val branch
          command: |
            cd /home/circleci/project
            git fetch origin ${CYPRESS_BRANCH}
            git checkout ${CYPRESS_BRANCH}
            git log -1 # Show current commit
      - attach_workspace:
          at: /home/circleci/project/coverage
      - setup-redcap:
          dir: "/home/circleci/project/"
      - run:
          name: Start Docker REDCap Container
          command: |
            cd /home/circleci/CCTC_REDCap_Docker
            docker compose up -d
      - run:
          name: Coverage Report
          command: |
            docker exec -i debian php /var/www/html/phpcov.phar merge --html /tmp/path/coverage-report/html-report /tmp/path/coverage

      - store_artifacts:
          path: /home/circleci/project/coverage/cypress/videos
          destination: /home/circleci/project/coverage/cypress/videos

      - persist_to_workspace:
          root: .
          paths:
            - coverage-report