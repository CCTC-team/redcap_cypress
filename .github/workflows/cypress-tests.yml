name: REDCap Cypress Tests

on:
  push:
    branches:
      - redcap_val
  workflow_dispatch:

env:
  CCTC_DOCKER_BRANCH: "redcap_val"
  CYPRESS_BRANCH: "redcap_val"
  RSVC_BRANCH: "redcap_val"
  RCTF_BRANCH: "redcap_val"

jobs:
  cypress-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Checkout CYPRESS_BRANCH
        run: |
          echo "Checking out branch: ${{ env.CYPRESS_BRANCH }}"
          git fetch origin ${{ env.CYPRESS_BRANCH }}
          git checkout ${{ env.CYPRESS_BRANCH }}
          git log -1

      - name: Read config from cypress.env.json.example
        run: |
          # Extract variables from cypress.env.json.example so they aren't hardcoded
          REDCAP_VERSION=$(jq -r '.redcap_version' cypress.env.json.example)
          DB_CONTAINER=$(jq -r '.mysql.docker_container' cypress.env.json.example)
          DB_HOST=$(jq -r '.mysql.host' cypress.env.json.example)
          DB_PORT=$(jq -r '.mysql.port' cypress.env.json.example)

          echo "REDCAP_VERSION=${REDCAP_VERSION}" >> $GITHUB_ENV
          echo "DB_CONTAINER=${DB_CONTAINER}" >> $GITHUB_ENV
          echo "DB_HOST=${DB_HOST}" >> $GITHUB_ENV
          echo "DB_PORT=${DB_PORT}" >> $GITHUB_ENV

          echo "Parsed from cypress.env.json.example:"
          echo "  REDCAP_VERSION=${REDCAP_VERSION}"
          echo "  DB_CONTAINER=${DB_CONTAINER}"
          echo "  DB_HOST=${DB_HOST}"
          echo "  DB_PORT=${DB_PORT}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Clone CCTC_REDCap_Docker
        env:
          GH_PAT: ${{ secrets.CCTC_TEAM_PAT }}
        run: |
          git clone --branch ${{ env.CCTC_DOCKER_BRANCH }} --depth=1 \
            https://x-access-token:${GH_PAT}@github.com/CCTC-team/CCTC_REDCap_Docker.git
          cd CCTC_REDCap_Docker && git log -1

      - name: Get REDCap Source
        env:
          REDCAP_SSH_KEY: ${{ secrets.REDCAP_SOURCE_SSH_KEY }}
        run: |
          # Setup SSH for private repos
          mkdir -p ~/.ssh
          echo "$REDCAP_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          # Determine branch/tag for REDCap version
          if [[ "${{ env.REDCAP_VERSION }}" = "99.99.99" ]]; then
            export BRANCH=main
          else
            export BRANCH=${{ env.REDCAP_VERSION }}
          fi

          # Clone REDCap source into CCTC_REDCap_Docker/redcap_source/
          cd CCTC_REDCap_Docker/redcap_source

          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            git clone --depth=1 --branch=$BRANCH git@github.com:CCTC-team/redcap_source.git _clone
          git -C _clone log -1

          # Copy versioned REDCap directory out of the clone
          cp -a _clone/redcap_v${{ env.REDCAP_VERSION }} .
          rm -rf _clone

          echo "=== redcap_source contents ==="
          ls -la

      - name: Build and start Docker services
        run: |
          cd CCTC_REDCap_Docker/redcap_docker

          # Create .env from template
          cp .env.example .env
          sed -i 's/REDCAP_VERSION=.*/REDCAP_VERSION=${{ env.REDCAP_VERSION }}/' .env

          echo "=== .env ==="
          cat .env

          # Build image (bakes redcap_source into the image)
          docker compose build

          # Start all services
          docker compose up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for MariaDB to be ready..."
          timeout 120 bash -c 'until docker exec ${{ env.DB_CONTAINER }} mysqladmin ping -h localhost --silent 2>/dev/null; do sleep 2; done'

          echo "Waiting for REDCap to be ready..."
          timeout 120 bash -c 'until curl -k -s -f https://localhost:8443 > /dev/null 2>&1; do sleep 2; done'

          echo "Services are ready!"
          docker ps -a

      - name: Set permissions for eDocs & Temp folders
        run: |
          # Create edocs and temp directories at the redcap_source level
          mkdir -p CCTC_REDCap_Docker/redcap_source/edocs
          mkdir -p CCTC_REDCap_Docker/redcap_source/temp
          sudo chmod -R 777 CCTC_REDCap_Docker/redcap_source/edocs
          sudo chmod -R 777 CCTC_REDCap_Docker/redcap_source/temp

      - name: Configure Cypress environment
        env:
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
        run: |
          # Generate cypress.config.js from template
          sed "s/PID/$PROJECT_ID/g" cypress.config.js.example > cypress.config.js

          # Generate cypress.env.json from template
          cp cypress.env.json.example cypress.env.json

          # Override only the values that differ in CI
          # mysql.path must use docker exec instead of local binary
          sed -i '/"path":/c\    "path": "docker exec -i ${{ env.DB_CONTAINER }} mysql",' cypress.env.json

          # Add CI-specific path configurations
          sed -i '/"temp_folder":/a\  "edocs_folder": "${{ github.workspace }}/CCTC_REDCap_Docker/redcap_source/edocs",' cypress.env.json
          sed -i '/"redcap_version":/a\  "redcap_source_path": "${{ github.workspace }}/CCTC_REDCap_Docker/redcap_source",' cypress.env.json

          echo "=== cypress.config.js (first 20 lines) ==="
          head -20 cypress.config.js
          echo ""
          echo "=== cypress.env.json ==="
          cat cypress.env.json

      - name: Update package.json dependencies for CCTC-team repositories
        run: |
          # Update rctf to use CCTC-team branch
          sed -i 's|"rctf": "github:vanderbilt-redcap/rctf#[^"]*"|"rctf": "github:CCTC-team/rctf#${{ env.RCTF_BRANCH }}"|' package.json

          # Update redcap_rsvc to use CCTC-team branch
          sed -i 's|"redcap_rsvc": "github:vanderbilt-redcap/redcap_rsvc#[^"]*"|"redcap_rsvc": "github:CCTC-team/vanderbilt_redcap_rsvc#${{ env.RSVC_BRANCH }}"|' package.json

          # Update repository URL to CCTC-team
          sed -i 's|"url": "https://github.com/vanderbilt-redcap/redcap_cypress.git"|"url": "https://github.com/CCTC-team/redcap_cypress.git"|' package.json

          echo "Updated package.json dependencies:"
          grep -E '(rctf|redcap_rsvc|repository)' -A 1 package.json

      - name: Install Cypress and dependencies
        run: |
          npm install
          npm run redcap_rsvc:install || echo "RSVC install failed or not needed"

      - name: Run Cypress tests
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
        run: |
          export UID
          if [ -n "$CYPRESS_RECORD_KEY" ]; then
            echo "Running tests with Cypress Dashboard recording..."
            CYPRESS_prettyEnabled=true npx cypress run \
              --record \
              --key $CYPRESS_RECORD_KEY \
              --group core-tests \
              --browser chrome \
              --ci-build-id ${{ github.run_id }}-${{ github.run_attempt }} \
              --reporter junit \
              --reporter-options "mochaFile=results/test-results-[hash].xml,toConsole=true" \
              || true
          else
            echo "Running tests without recording..."
            CYPRESS_prettyEnabled=true npx cypress run \
              --browser chrome \
              --reporter junit \
              --reporter-options "mochaFile=results/test-results-[hash].xml,toConsole=true" \
              || true
          fi

      - name: Generate coverage report
        if: always()
        run: |
          if docker exec redcap-app test -f /var/www/html/phpcov.phar 2>/dev/null; then
            docker exec redcap-app sh -c "php /var/www/html/phpcov.phar merge \
              --clover /tmp/path/coverage-report/coverage.xml \
              /tmp/path/coverage" || echo "Coverage report generation failed"
          else
            echo "phpcov.phar not found, skipping coverage report"
          fi

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: results/*.xml
          check_name: Cypress Test Results
          comment_title: REDCap Cypress Test Results

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: /tmp/path/coverage-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          cd CCTC_REDCap_Docker/redcap_docker
          docker compose down -v
