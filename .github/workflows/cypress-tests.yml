name: REDCap Cypress Tests

on:
  push:
    branches:
      - redcap_val
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

# Cancel an in-progress run (all 4 shards) when a newer commit is pushed to the
# same ref, so stacked pushes don't each consume a full matrix of Actions minutes.
concurrency:
  group: cypress-${{ github.ref }}
  cancel-in-progress: true

env:
  CCTC_DOCKER_REF: "v1.0.0"
  SHARD_TOTAL: "4"

jobs:
  cypress-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
      checks: write
    env:
      SHARD_INDEX: ${{ matrix.shard }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Read config from cypress.env.json.example
        run: |
          # Extract variables from cypress.env.json.example so they aren't hardcoded
          REDCAP_VERSION=$(jq -r '.redcap_version' cypress.env.json.example)
          DB_CONTAINER=$(jq -r '.mysql.docker_container' cypress.env.json.example)
          DB_HOST=$(jq -r '.mysql.host' cypress.env.json.example)
          DB_PORT=$(jq -r '.mysql.port' cypress.env.json.example)

          echo "REDCAP_VERSION=${REDCAP_VERSION}" >> $GITHUB_ENV
          echo "DB_CONTAINER=${DB_CONTAINER}" >> $GITHUB_ENV
          echo "DB_HOST=${DB_HOST}" >> $GITHUB_ENV
          echo "DB_PORT=${DB_PORT}" >> $GITHUB_ENV

          echo "Parsed from cypress.env.json.example:"
          echo "  REDCAP_VERSION=${REDCAP_VERSION}"
          echo "  DB_CONTAINER=${DB_CONTAINER}"
          echo "  DB_HOST=${DB_HOST}"
          echo "  DB_PORT=${DB_PORT}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Cache Cypress binary
        # setup-node caches npm *packages* but not the (~hundreds of MB) Cypress
        # binary, which npm ci re-downloads every run x 4 shards. Cache it keyed on
        # the lockfile so it's restored instead of re-downloaded.
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-binary-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            cypress-binary-${{ runner.os }}-

      - name: Install xmllint (libxml2-utils)
        # The validateFileFormat Cypress task shells out to `xmllint` on the
        # runner host to check that exported CDISC ODM XML is well-formed and
        # schema-conformant (e.g. spec D.21.700). ubuntu-latest does not ship
        # the xmllint binary by default; it lives in the libxml2-utils package.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils
          xmllint --version

      - name: Clone CCTC_REDCap_Docker
        env:
          GH_PAT: ${{ secrets.CCTC_TEAM_PAT }}
        run: |
          git clone --branch ${{ env.CCTC_DOCKER_REF }} --depth=1 \
            https://x-access-token:${GH_PAT}@github.com/CCTC-team/CCTC_REDCap_Docker.git
          cd CCTC_REDCap_Docker && git log -1

      - name: Get REDCap Source
        env:
          GH_PAT: ${{ secrets.CCTC_TEAM_PAT }}
        run: |
          # Determine branch/tag for REDCap version
          if [[ "${{ env.REDCAP_VERSION }}" = "99.99.99" ]]; then
            export BRANCH=main
          else
            export BRANCH=${{ env.REDCAP_VERSION }}
          fi

          # Clone REDCap source into CCTC_REDCap_Docker/redcap_source/
          cd CCTC_REDCap_Docker/redcap_source

          git clone --depth=1 --branch=$BRANCH \
            https://x-access-token:${GH_PAT}@github.com/CCTC-team/redcap_source.git _clone
          git -C _clone log -1

          # Copy all REDCap files out of the clone (top-level files + versioned directory)
          cp -a _clone/* _clone/.* . 2>/dev/null || true
          rm -rf _clone .git

          echo "=== redcap_source contents ==="
          ls -la

      - name: Build and start Docker services
        run: |
          cd CCTC_REDCap_Docker/redcap_docker

          # Create .env from template
          cp .env.example .env
          sed -i 's/REDCAP_VERSION=.*/REDCAP_VERSION=${{ env.REDCAP_VERSION }}/' .env

          echo "=== .env ==="
          cat .env

          # Build image (bakes redcap_source into the image)
          docker compose build

          # Start all services
          docker compose up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for MariaDB to be ready..."
          timeout 120 bash -c 'until docker exec ${{ env.DB_CONTAINER }} mysqladmin ping -h localhost --silent 2>/dev/null; do sleep 2; done'

          echo "Waiting for REDCap to be ready..."
          timeout 120 bash -c 'until curl -k -s -f https://localhost:8443 > /dev/null 2>&1; do sleep 2; done'

          echo "Services are ready!"
          docker ps -a

      - name: Set permissions for eDocs & Temp folders
        run: |
          # Create edocs and temp directories at the redcap_source level
          mkdir -p CCTC_REDCap_Docker/redcap_source/edocs
          mkdir -p CCTC_REDCap_Docker/redcap_source/temp
          sudo chmod -R 777 CCTC_REDCap_Docker/redcap_source/edocs
          sudo chmod -R 777 CCTC_REDCap_Docker/redcap_source/temp

      - name: Configure Cypress environment
        env:
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
        run: |
          # Generate cypress.config.js from template
          sed "s/PID/$PROJECT_ID/g" cypress.config.js.example > cypress.config.js

          # Generate cypress.env.json from template
          cp cypress.env.json.example cypress.env.json

          # Override values that differ in CI
          # mysql.path must use docker exec instead of local binary
          sed -i '/"path":/c\    "path": "docker exec -i ${{ env.DB_CONTAINER }} mysql",' cypress.env.json
          # mysql.port is 3306 inside the container (not 3400 host-mapped port)
          sed -i '/"port":/c\    "port": "3306",' cypress.env.json

          # Add CI-specific path configurations
          sed -i '/"temp_folder":/a\  "edocs_folder": "${{ github.workspace }}/CCTC_REDCap_Docker/redcap_source/edocs",' cypress.env.json
          sed -i '/"redcap_version":/a\  "redcap_source_path": "${{ github.workspace }}/CCTC_REDCap_Docker/redcap_source",' cypress.env.json

          echo "=== cypress.config.js (first 20 lines) ==="
          head -20 cypress.config.js
          echo ""
          echo "=== cypress.env.json ==="
          cat cypress.env.json

      - name: Install Cypress and dependencies
        run: |
          # npm ci installs exactly the committed package-lock.json (deterministic,
          # matched esbuild) instead of `npm install` + `redcap_rsvc:install`, whose
          # `clean` deleted package-lock.json and reinstalled lockless — that drift
          # caused esbuild's "Expected id N but got id N-1" crash at config load.
          npm ci
          # move_files moves redcap_rsvc out of node_modules to ./redcap_rsvc (where
          # the specPattern finds the Feature Tests) and copies its fixtures into
          # cypress/fixtures. Non-destructive half of redcap_rsvc:install — keeps the
          # lockfile. Without it there are no specs to run and fixtures are missing.
          npm run redcap_rsvc:move_files

      - name: Discover specs for shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }}
        id: specs
        run: |
          node scripts/list-specs.js shard-specs.txt
          SPEC_COUNT=$(grep -c . shard-specs.txt || echo 0)
          echo "spec_count=${SPEC_COUNT}" >> $GITHUB_OUTPUT
          echo "Shard ${SHARD_INDEX}/${SHARD_TOTAL} will run ${SPEC_COUNT} specs:"
          cat shard-specs.txt

      - name: Run Cypress tests (shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }})
        if: steps.specs.outputs.spec_count != '0'
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          CYPRESS_prettyEnabled: 'true'
          CYPRESS_BROWSER: chrome
          CYPRESS_MAX_ATTEMPTS: '3'
          CYPRESS_GROUP_PREFIX: shard-${{ matrix.shard }}
          # Diagnostic: disable Cypress dashboard recording to test whether
          # api.cypress.io stalls were causing the mid-run hang. Remove this
          # line once recording is confirmed safe (or keep it permanently
          # if recording is no longer needed in CI).
          CYPRESS_DISABLE_RECORDING: '1'
          # Watchdog: if no new spec report appears for 30 min, treat as hung.
          CYPRESS_STALL_MS: '1800000'
        run: |
          export UID
          npm run test:retry-failed -- --spec-file shard-specs.txt

      - name: Generate combined HTML report
        if: always()
        run: |
          if ls cypress/results/json/*.json >/dev/null 2>&1; then
            npm run report
            REPORT_BASENAME="CCTC_rsvc_v${{ env.REDCAP_VERSION }}-test-report"
            mv cypress/results/test-report.json "cypress/results/${REPORT_BASENAME}.json"
            mv cypress/results/html/test-report.html "cypress/results/html/${REPORT_BASENAME}.html"
            echo "Renamed merged report to ${REPORT_BASENAME}.{json,html}"
          else
            echo "::warning::No mochawesome JSON files were produced — Cypress likely failed before any spec ran."
          fi

      - name: Upload mochawesome reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CCTC_rsvc_v${{ env.REDCAP_VERSION }}-shard-${{ matrix.shard }}-cypress-results
          path: |
            cypress/results/json/*.json
            cypress/results/CCTC_rsvc_v${{ env.REDCAP_VERSION }}-test-report.json
            cypress/results/html/CCTC_rsvc_v${{ env.REDCAP_VERSION }}-test-report.html
          retention-days: 7
          if-no-files-found: warn

      - name: Generate coverage report
        if: always()
        run: |
          if docker exec redcap-app test -f /var/www/html/phpcov.phar 2>/dev/null; then
            mkdir -p /tmp/path/coverage-report
            docker exec redcap-app sh -c "php /var/www/html/phpcov.phar merge \
              --clover /tmp/path/coverage-report/coverage.xml \
              /tmp/path/coverage" || echo "Coverage report generation failed"
          else
            echo "phpcov.phar not found, skipping coverage report"
          fi

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: CCTC_rsvc_v${{ env.REDCAP_VERSION }}-shard-${{ matrix.shard }}-cypress-screenshots
          path: cypress/screenshots/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CCTC_rsvc_v${{ env.REDCAP_VERSION }}-shard-${{ matrix.shard }}-coverage-reports
          path: /tmp/path/coverage-report/
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          cd CCTC_REDCap_Docker/redcap_docker
          docker compose down -v

  # Prune Actions artifact storage: keep only the N most recent workflow runs'
  # artifacts and delete everything older, to stay under the org's 2 GB Actions
  # storage quota. Runs after the test matrix so the current run's artifacts
  # already exist and are counted among the kept runs.
  prune-artifacts:
    needs: cypress-tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      KEEP_RUNS: "2"   # keep the latest run + the one before it
    steps:
      - name: Delete artifacts from older runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Distinct run IDs that still have live artifacts, newest first
          RUN_IDS=$(gh api "repos/${REPO}/actions/artifacts" --paginate \
            --jq '.artifacts[] | select(.expired==false) | [.workflow_run.id, .created_at] | @tsv' \
            | awk -F'\t' '{ if($2>seen[$1]) seen[$1]=$2 } END { for(r in seen) print seen[r]"\t"r }' \
            | sort -r | awk -F'\t' '{print $2}')

          KEEP_SET=$(echo "$RUN_IDS" | head -n "$KEEP_RUNS" | paste -sd, -)
          echo "Keeping artifacts from runs: ${KEEP_SET:-<none>}"

          gh api "repos/${REPO}/actions/artifacts" --paginate \
            --jq '.artifacts[] | select(.expired==false) | [.workflow_run.id, .id, .name] | @tsv' \
            | while IFS=$'\t' read -r runid artid name; do
                case ",$KEEP_SET," in
                  *",$runid,"*) ;;  # within the keep window — leave it
                  *)
                    echo "Deleting $name (run $runid, artifact $artid)"
                    gh api -X DELETE "repos/${REPO}/actions/artifacts/${artid}" \
                      && echo "  ok" || echo "  failed (continuing)"
                    ;;
                esac
              done
