name: Build and Push Cypress Runner Image

# Publishes the pinned Cypress runner image (cypress/included + chromium + docker
# CLI + xmllint) that cypress-tests.yml runs the suite inside, so the test runtime
# is byte-identical locally (docker_bin/cypress-runner/run.sh) and in CI. Lives in
# redcap_cypress because the runner Dockerfile lives here. Rebuilt only when the
# runner Dockerfile changes — not on every test run.
#
# Multi-arch: linux/amd64 (GitHub CI) + linux/arm64 (local Apple Silicon).
# Image: ghcr.io/cctc-team/redcap_cypress/cypress-runner:15.10.0 (+ latest).

on:
  push:
    branches:
      - redcap_val
    paths:
      - 'docker_bin/cypress-runner/Dockerfile'
      - '.github/workflows/build-cypress-runner.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cypress-runner
  # Keep in lockstep with the cypress/included base tag in the runner Dockerfile.
  RUNNER_TAG: "15.10.0"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.RUNNER_TAG }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: docker_bin/cypress-runner
          file: docker_bin/cypress-runner/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.meta.outputs.digest }}"
