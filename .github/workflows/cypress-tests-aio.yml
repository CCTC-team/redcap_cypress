name: REDCap Cypress Tests (AIO)

# DIAGNOSTIC BRANCH ONLY (test/econsent-pageload-diag) — never merge.
#
# Since 2026-11-18 PM, eConsent specs (and D.3.28.0100) time out with "Your page
# did not fire its `load` event within 120000ms" on the first navigation after a
# page that embeds REDCap's inline PDF.js viewer, on SOME shards only, while the
# REDCap image, runner image, Cypress and Chromium build are unchanged from the
# last green run. This run answers:
#   1. Does Google Chrome (bundled in cypress/included) avoid it vs Chromium?
#   2. Do failing jobs correlate with runner hardware (CPU model / cores / RAM)?
#   3. Do the stalled requests reach Apache at all (AIO container logs)?
#
# RUN 2: rctf commands/data_import.js reverted to 5c179ca (pre Survey-Settings
# CSV change, the green run's rctf) by bind-mounting it over the baked copy.
#
# No image build/push, no report publish, no artifact pruning: it reuses the
# already-published runner image for redcap_val 3e7193c.

on:
  push:
    branches:
      - test/econsent-pageload-diag

concurrency:
  group: cypress-aio-diag-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REDCAP_CONTAINER: CCTC_REDCap_Docker
  AIO_IMAGE: ghcr.io/cctc-team/cctc_redcap_docker/redcap-aio:latest
  RUNNER_IMAGE: ghcr.io/cctc-team/redcap_cypress/cypress-runner-aio:3e7193c
  SPECS: >-
    redcap_rsvc/Feature Tests/C/e-Consent framework_24/C.3.24.0405. - eConsent goverend snapshot.feature,redcap_rsvc/Feature Tests/C/e-Consent framework_24/C.3.24.0705. - eConsent Certification Page.feature,redcap_rsvc/Feature Tests/C/e-Consent framework_24/C.3.24.1500. - eConsent version control.feature,redcap_rsvc/Feature Tests/C/e-Consent framework_24/C.3.24.2000. - eConsent display.feature,redcap_rsvc/Feature Tests/C/e-Consent framework_24/C.3.24.2500. - PDF conditional logic.feature,redcap_rsvc/Feature Tests/C/e-Consent framework_24/C.3.24.2800. - PDF filename.feature,redcap_rsvc/Feature Tests/D/eDocs_28/D.3.28.0100. - Storage location for uploaded documents.feature

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
        rep: [1, 2, 3, 4, 5, 6]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout (for the rctf override file)
        uses: actions/checkout@v5

      - name: Runner hardware and Docker
        run: |
          echo "CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
          echo "cores: $(nproc)"; free -m; uname -r
          docker version --format 'docker server {{.Server.Version}}'

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.CCTC_TEAM_PAT }}" | docker login "${REGISTRY}" -u ${{ github.actor }} --password-stdin

      - name: Pull stack images
        run: |
          # Stagger to avoid GHCR's secondary rate limit (8 jobs, same account).
          off=0; [ "${{ matrix.browser }}" = "chrome" ] && off=60
          sleep $(( (${{ matrix.rep }} - 1) * 15 + off ))
          for img in "${AIO_IMAGE}" "${RUNNER_IMAGE}"; do
            for a in 1 2 3 4 5; do docker pull -q "$img" && break; sleep $((30 * a)); done
          done

      - name: Start all-in-one REDCap
        run: |
          docker run -d --name "${REDCAP_CONTAINER}" -p 8443:8443 -p 8025:8025 \
            -v cctc_mariadb_data:/var/lib/mysql "${AIO_IMAGE}"
          timeout 360 bash -c 'until curl -k -s -f https://localhost:8443 > /dev/null 2>&1; do sleep 3; done'

      - name: Run specs in ${{ matrix.browser }}
        run: |
          mkdir -p results screenshots
          docker run --rm --network host --shm-size=2g \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/results:/work/redcap_cypress/cypress/results" \
            -v "${PWD}/screenshots:/work/redcap_cypress/cypress/screenshots" \
            -v "${PWD}/diag_overrides/data_import.js:/work/redcap_cypress/node_modules/rctf/commands/data_import.js:ro" \
            -e CYPRESS_MYSQL_CONTAINER="${REDCAP_CONTAINER}" \
            -e CYPRESS_REDCAP_CONTAINER="${REDCAP_CONTAINER}" \
            -e CYPRESS_baseUrl="https://localhost:8443" \
            -e RUNNER_BROWSER=${{ matrix.browser }} \
            -e CYPRESS_prettyEnabled=true \
            "${RUNNER_IMAGE}" --spec "${SPECS}"

      - name: Save REDCap container logs (Apache access/error)
        if: always()
        run: |
          mkdir -p diag
          docker logs -t "${REDCAP_CONTAINER}" > diag/redcap-container.log 2>&1 || true
          sudo chown -R "$(id -u):$(id -g)" results screenshots 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diag-${{ matrix.browser }}-${{ matrix.rep }}
          path: |
            diag/
            screenshots/
          retention-days: 7
          if-no-files-found: ignore
